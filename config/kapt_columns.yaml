# 데이터 정규화 규칙 (실행가이드 §9.3)
normalization:
  approval_date:
    input_format: "YYYYMMDD (문자열)"
    parse_rule: "8자리면 date, 그 외는 NULL + 원본 approval_date_raw 보존"
    example: "20040517 → 2004-05-17"
  household_count:
    cast: "float → int"
    null_when: ["", "-", "null"]
  addr_legal:
    trim: true
    keep_apartment_suffix: true       # 단지명 접미어 유지 (지오코딩 정확도)
  addr_road:
    nullable: true                    # R4/R5처럼 도로명 NULL 케이스 존재
  kapt_code:
    pattern: "^[A-Z][0-9]{8}$"        # 예: A11007001
    is_primary_key: true

# 매칭 워크플로 (실행가이드 §9.3 매칭 주의)
match_workflow:
  step1: "후보 신도시명(단지명) 문자열 검색"
  step2: "법정동주소/도로명주소로 재확인"
  step3: "행정동 자동귀속 금지 - 사람이 development_id 부여"
  output_path: "data/staged/kapt_basic.parquet"
  qa_export_path: "exports/kapt_basic_qa.csv"

# 스키마 안정성 체크
schema_guard:
  expected_column_count: 85
  required_headers_row2:
    - "단지코드"
    - "단지명"
    - "법정동주소"
    - "도로명주소"
    - "사용승인일"
    - "동수"
    - "세대수"
  fail_fast_if_missing: true
