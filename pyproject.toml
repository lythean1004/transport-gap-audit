[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transport-gap-audit"
version = "0.1.0"
description = "Korean public-data accountability project for transport gap analysis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "polars",
    "pyarrow",
    "httpx",
    "requests",
    "python-dotenv",
    "pydantic",
    "pymupdf",
    "streamlit",
    "pydeck",
    "pytest",
    "tenacity",
    "openpyxl"
]

[project.optional-dependencies]
ai = [
    "google-genai"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "qa/submission_v1/pytest_cache"
